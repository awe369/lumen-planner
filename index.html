<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumen — Daily Dashboard</title>
  <meta name="description" content="Personal dashboard: to-dos, month & year planner, and an advanced time-blocking system.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23c4b5fd'/><stop offset='1' stop-color='%23f0abfc'/></linearGradient></defs><circle cx='16' cy='16' r='13' fill='url(%23g)'/><circle cx='16' cy='16' r='5' fill='%230d0d14'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><div class="grain"></div></div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">Lumen</span>
      </div>
      <nav class="nav" id="nav">
        <button data-view="dashboard"><span class="ico" data-icon="home"></span><span>Dashboard</span></button>
        <button data-view="todo"><span class="ico" data-icon="check"></span><span>To-Do</span></button>
        <button data-view="planner"><span class="ico" data-icon="calendar"></span><span>Planner</span></button>
        <button data-view="blocker"><span class="ico" data-icon="blocks"></span><span>Time Blocks</span></button>
        <button data-view="habits"><span class="ico" data-icon="flame"></span><span>Habits</span></button>
        <button data-view="sleep"><span class="ico" data-icon="bed"></span><span>Sleep</span></button>
      </nav>
      <div class="side-foot">
        <button class="focus-btn" id="focusBtn"><span class="ico" data-icon="target"></span><span>Focus mode</span></button>
        <div class="side-row">
          <button class="icon-btn" id="themeBtn" title="Toggle theme"><span class="ico" data-icon="moon"></span></button>
          <button class="icon-btn" id="settingsBtn" title="Settings"><span class="ico" data-icon="gear"></span></button>
        </div>
      </div>
    </aside>

    <main class="main" id="main"></main>
  </div>

  <div id="modalRoot"></div>
  <div id="focus" class="focus" hidden></div>
  <div id="toasts" class="toasts"></div>

  <script src="app.js"></script>
  <script src="trackers.js"></script>
  <div id="tip" class="tip" hidden></div>
</body>
</html>
